<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Ayush Sharma — Backend engineer building scalable microservices and event-driven systems. Java, Kotlin, TypeScript, Spring Boot, Kafka, AWS. Jupiter Money, ex-Zscaler." />
    <meta property="og:title" content="Ayush Sharma — Backend Engineer" />

    <meta property="og:image" content="ayush.webp" />
    <link rel="preload" as="image" href="ayush.webp" />
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0b0d'/><text x='6' y='23' font-family='monospace' font-size='18' fill='%2339ff88'>&gt;_</text></svg>" />
    <style>
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 18px;
        background: #0a0b0d radial-gradient(#1f232a 1px, transparent 1px) 0 0 / 28px 28px;
        font: 15px ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace; color: #8b929c;
        transition: opacity .45s ease, visibility .45s; }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot .b-logo { font-size: 28px; font-weight: 700; color: #39ff88; text-shadow: 0 0 24px rgb(57 255 136 / .45); }
      #boot .b-logo i { display: inline-block; width: .55em; height: 1em; margin-left: 4px; vertical-align: -.12em;
        background: #39ff88; animation: b-blink 1s steps(1) infinite; }
      #boot .b-bar { position: relative; width: min(220px, 60vw); height: 2px; background: #1f232a; border-radius: 2px; overflow: hidden; }
      #boot .b-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #39ff88, #7cc4ff); box-shadow: 0 0 12px #39ff88;
        animation: b-scan 1.1s cubic-bezier(.6, 0, .4, 1) infinite; }
      #boot .b-line { margin: 0; font-size: 12px; letter-spacing: .02em; }
      #boot .b-line b { color: #39ff88; font-weight: 400; }
      @keyframes b-blink { 50% { opacity: 0; } }
      @keyframes b-scan { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <div class="b-logo">&gt;_ ayush<i></i></div>
      <div class="b-bar"></div>
      <p class="b-line"><b>$</b> starting services…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
